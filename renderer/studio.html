<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>MaxyStudio</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="studio.css">
  <script type="importmap">{ "imports": { "three": "/three/build/three.module.min.js", "three/addons/": "/three/examples/jsm/" } }</script>
  <script src="icons.js"></script>
</head>
<body class="un">
  <div class="un-app" id="app">
    <!-- Barre du haut : menus, lecture, projet -->
    <header class="un-top">
      <div class="un-menus">
        <span class="un-logo" title="MaxyStudio"><img src="logo.svg" width="18" height="18" alt=""></span>
        <button class="un-menu" data-menu="file">Fichier</button>
        <button class="un-menu" data-menu="edit">Édition</button>
        <button class="un-menu" data-menu="assets">Assets</button>
        <button class="un-menu" data-menu="object">Objet</button>
        <button class="un-menu" data-menu="component">Composant</button>
        <button class="un-menu" data-menu="window">Fenêtre</button>
        <button class="un-menu" data-menu="plugins">Plugins</button>
        <button class="un-menu" data-menu="help">Aide</button>
      </div>
      <div class="un-play">
        <button class="un-pbtn" id="playBtn" title="Lancer (Ctrl+P)"><span data-ic="play" data-size="15"></span></button>
        <button class="un-pbtn" id="pauseBtn" title="Pause (Ctrl+Maj+P)"><span data-ic="pause" data-size="15"></span></button>
        <button class="un-pbtn" id="stepBtn" title="Image suivante (Ctrl+Alt+P)"><span data-ic="stepFwd" data-size="15"></span></button>
      </div>
      <div class="un-right">
        <div class="un-plugbar" id="pluginBar" hidden title="Barre des plugins"></div>
        <span class="un-type" id="projType">2D</span>
        <button class="un-proj" id="projBtn" title="Projets récents"><span data-ic="folder" data-size="14"></span><b id="projName">Projet</b><span data-ic="chevronDown" data-size="12"></span></button>
        <button class="un-btn" id="exportBtn" title="Exporter tout le projet en un fichier .scratchcode"><span data-ic="share" data-size="14"></span>Exporter</button>
      </div>
    </header>

    <main class="un-main" id="main">
      <!-- Hiérarchie -->
      <section class="un-panel un-hier" id="hierPanel">
        <div class="un-tabs"><span class="un-tab active"><span data-ic="list" data-size="13"></span>Hiérarchie</span><span class="grow"></span>
          <button class="un-ibtn" id="hierAdd" title="Créer un objet"><span data-ic="plus" data-size="14"></span></button></div>
        <div class="un-search"><span data-ic="search" data-size="13"></span><input id="hierSearch" placeholder="Rechercher" spellcheck="false"></div>
        <div class="un-body" id="hier"></div>
      </section>
      <div class="un-sash v" data-sash="hier"></div>

      <!-- Vues centrales : Scène, Jeu, scripts -->
      <section class="un-panel un-center">
        <div class="un-tabs" id="centerTabs"></div>
        <div class="un-views">
          <div class="un-view" id="sceneView">
            <div class="un-scenebar">
              <div class="un-seg" id="tools">
                <button data-tool="hand" title="Main (Q)"><span data-ic="hand" data-size="15"></span></button>
                <button data-tool="translate" class="on" title="Déplacer (W)"><span data-ic="move" data-size="15"></span></button>
                <button data-tool="rotate" title="Pivoter (E)"><span data-ic="rotate" data-size="15"></span></button>
                <button data-tool="scale" title="Redimensionner (R)"><span data-ic="scale" data-size="15"></span></button>
              </div>
              <button class="un-chip" id="spaceBtn" title="Repère des gizmos">Global</button>
              <button class="un-chip" id="snapBtn" title="Aimantation (maintiens Ctrl pendant le déplacement)">Aimant</button>
              <span class="grow"></span>
              <button class="un-chip" id="gridBtn" title="Afficher la grille">Grille</button>
              <button class="un-chip" id="focusBtn" title="Cadrer la sélection (F)">Cadrer</button>
            </div>
            <div class="un-canvas" id="sceneCanvas"></div>
            <div class="un-hint" id="sceneHint"></div>
          </div>
          <div class="un-view" id="gameView" hidden>
            <div class="un-scenebar">
              <span class="un-dim" id="gameInfo">Affichage 4:3 (480 × 360)</span>
              <span class="grow"></span>
              <button class="un-chip" id="maxBtn" title="Agrandir pendant le jeu">Agrandir en jeu</button>
              <button class="un-chip" id="muteBtn" title="Couper le son">Son</button>
            </div>
            <div class="un-game">
              <div class="un-loading" id="engineLoading">Chargement du moteur…</div>
              <iframe id="engine" src="/index.html?studio=1" title="Jeu"></iframe>
            </div>
          </div>
          <div class="un-view" id="codeView" hidden><div id="monaco"></div><div class="un-insp-badge" id="inspection"></div></div>
        </div>
      </section>
      <div class="un-sash v" data-sash="insp"></div>

      <!-- Inspecteur -->
      <section class="un-panel un-insp" id="inspPanel">
        <div class="un-tabs"><span class="un-tab active"><span data-ic="sliders" data-size="13"></span>Inspecteur</span></div>
        <div class="un-body" id="insp"></div>
      </section>

      <div class="un-sash h" data-sash="bottom"></div>
      <!-- Projet et Console -->
      <section class="un-panel un-bottom" id="bottomPanel">
        <div class="un-tabs">
          <button class="un-tab active" data-btab="project"><span data-ic="folder" data-size="13"></span>Projet</button>
          <button class="un-tab" data-btab="console"><span data-ic="terminal" data-size="13"></span>Console <span class="un-count" id="logCount"></span></button>
          <span class="grow"></span>
          <div class="un-btools" id="projTools">
            <button class="un-btn sm" id="importBtn"><span data-ic="download" data-size="13"></span>Importer</button>
            <button class="un-btn sm" id="createBtn"><span data-ic="plus" data-size="13"></span>Créer</button>
            <div class="un-search sm"><span data-ic="search" data-size="12"></span><input id="assetSearch" placeholder="Rechercher" spellcheck="false"></div>
          </div>
          <div class="un-btools" id="consoleTools" hidden>
            <button class="un-btn sm" id="clearLog">Effacer</button>
            <button class="un-chip" id="collapseLog" title="Regrouper les messages identiques">Regrouper</button>
            <button class="un-chip on" id="clearOnPlay" title="Effacer la console au lancement">Effacer au lancement</button>
            <button class="un-chip on lv" data-lv="log"><span data-ic="info" data-size="12"></span><span id="nLog">0</span></button>
            <button class="un-chip on lv" data-lv="warn"><span data-ic="alertTri" data-size="12"></span><span id="nWarn">0</span></button>
            <button class="un-chip on lv" data-lv="error"><span data-ic="alert" data-size="12"></span><span id="nErr">0</span></button>
          </div>
        </div>
        <div class="un-bbody">
          <div class="un-project" id="projectView">
            <div class="un-folders" id="folders"></div>
            <div class="un-assets-wrap">
              <div class="un-crumbs" id="assetCrumbs"></div>
              <div class="un-assets" id="assets"></div>
              <div class="un-drop" id="dropHint">Dépose tes fichiers ici pour les importer</div>
            </div>
          </div>
          <div class="un-console" id="consoleView" hidden></div>
        </div>
      </section>
    </main>

    <footer class="un-status">
      <span id="statusMsg">Prêt</span>
      <span class="grow"></span>
      <span id="statusSave"></span>
      <span id="statusCursor"></span>
      <span>MaxyStudio <span id="appVer">2.0</span></span>
    </footer>
  </div>

  <div class="un-menu-pop" id="menu"></div>
  <div class="un-modal-back" id="modalBack"><div class="un-modal"><h3 id="modalTitle"></h3><div id="modalBody"></div><div class="row"><button class="un-btn" id="modalCancel">Annuler</button><button class="un-btn primary" id="modalOk">OK</button></div></div></div>
  <div class="un-toast" id="toast"></div>

  <script src="/monaco/vs/loader.js"></script>
  <script type="module" src="studio.js"></script>
</body>
</html>
